<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title data-i18n="{{title_key}}" data-i18n-vars="{{meta_vars}}"></title>
<meta name="description" data-i18n-content="{{description_key}}" data-i18n-vars="{{meta_vars}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="{{root}}dist/svg/silhouette/mayotte-simple.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<link rel="stylesheet" href="{{root}}assets/gallery.css">
</head>
<body data-page="{{page}}" data-section="{{section}}" data-root="{{root}}">
<div class="wrap top">
  <a class="brand" href="{{home}}" data-nav><span class="glyph" aria-hidden="true"></span><span data-i18n="page.brand"></span></a>
  <div class="top-actions">
    <div class="lang" role="group" data-i18n-label="page.language">
      <button type="button" data-lang="fr" lang="fr" aria-pressed="true"><span aria-hidden="true" data-i18n="lang.fr"></span><span class="visually-hidden" data-i18n="lang.fr.name"></span></button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false"><span aria-hidden="true" data-i18n="lang.en"></span><span class="visually-hidden" data-i18n="lang.en.name"></span></button>
    </div>
    <a class="repo" href="https://github.com/beeraw/mayotte-maps" data-i18n-label="page.repository" data-i18n-title="page.repository">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
</div>

{{body}}

<footer class="wrap">
  <div class="foot">
    <p class="credit" id="credit">{{credit}}</p>
    <p data-i18n="page.sources"></p>
  </div>
</footer>

<script src="{{root}}assets/gallery.js" defer></script>
</body>
</html>
